# Decision-gate experiment v1 -- Together AI leg.
#
# Identical design to configs/gates_v1.yaml (same items, seed, variants,
# calibration band and repeats). Only the provider block differs, so results
# are directly comparable to the published v1 legs via `gates-drift`.
#
# SET BEFORE RUNNING (.env is loaded automatically):
#   OPENAI_COMPAT_BASE_URL=https://api.together.xyz/v1
#   OPENAI_COMPAT_API_KEY=...
#
# `model_text` / `model_vision` must match Together's model string EXACTLY, and
# the vision model must accept image input -- list what your key can reach with:
#   .venv/bin/python -c "import os,openai;
#   [print(m.id) for m in openai.OpenAI(api_key=os.environ['OPENAI_COMPAT_API_KEY'],
#   base_url=os.environ['OPENAI_COMPAT_BASE_URL']).models.list().data]"
#
# service_tier is deliberately absent: it is OpenAI-only and compatible
# endpoints reject unknown params.

run_tag: gates_v1_together
seed: 42

gates:
  - resume
  - moderation
  - appeal

calibration:
  repeats: 8
  band: [0.15, 0.85]
  n_select: 20

vision:
  repeats: 6

# Visual variants: fonts (controls + accessibility), color, highlighting,
# and layout density. T3_sans is the within-image reference.
variants:
  - id: T1_serif
    font_file: LiberationSerif-Regular.ttf

  - id: T3_sans
    font_file: LiberationSans-Regular.ttf

  - id: T7_comic
    font_file: ComicNeue-Regular.ttf

  - id: A1_opendyslexic
    font_file: OpenDyslexic-Regular.otf

  - id: A2_large_sans
    font_file: LiberationSans-Regular.ttf
    size_scale: 1.5

  - id: C1_red
    font_file: LiberationSans-Regular.ttf
    text_color: "#B00000"

  - id: C2_gray
    font_file: LiberationSans-Regular.ttf
    text_color: "#8C8C8C"

  - id: H1_highlight
    font_file: LiberationSans-Regular.ttf
    highlight_color: "#FFF2A8"

  - id: L1_cramped
    font_file: LiberationSans-Regular.ttf
    size_scale: 0.75
    line_spacing: 1.0

render:
  image_width: 1400
  base_size: 40
  padding_x: 90
  padding_y: 70
  max_text_width: 1220
  font_normalization: ag_height

providers:
  openai_compatible:
    api_key_env: OPENAI_COMPAT_API_KEY
    model_text: PUT_TOGETHER_MODEL_ID_HERE
    model_vision: PUT_TOGETHER_MODEL_ID_HERE
inference:
  temperature: null  # reasoning-era models reject explicit temperature
  max_retries: 6
  rate_limit_sleep: 1.5
  workers: 8
  seed: 42
