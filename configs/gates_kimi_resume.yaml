# Decision-gate experiment -- Kimi K3 on Together AI, RESUME GATE ONLY.
#
# Same design as configs/gates_v1.yaml (identical items, seed, variants,
# calibration band and repeats) with `gates` narrowed to the resume screen, so
# the numbers stay directly comparable to the published v1 legs:
#
#   typo-eval gates-drift --run-a gates_v1 --run-b gates_kimi_resume
#
# SET BEFORE RUNNING (.env is loaded automatically):
#   OPENAI_COMPAT_BASE_URL=https://api.together.xyz/v1
#   OPENAI_COMPAT_API_KEY=...
#
# VERIFIED against the live Together endpoint on 2026-08-15:
#   - `moonshotai/Kimi-K3` exists and is the first-party id (the `moonshot/*`
#     and `together_sso/*` duplicates are internal/test copies -- do not use)
#   - it accepts image_url content: a real resume render returned "No" at
#     1,291 input tokens, so the vision arm works over this endpoint
#   - pricing $3.00 in / $15.00 out per Mtok (cached input $0.30)
#
# NOTE: K3 emits hidden reasoning tokens. Measured output on this gate was
# 52-407 tokens per call despite "Answer only with Yes or No" and a one-word
# visible response. At $15/Mtok that is ~1/3 of the run cost, and nothing here
# caps it -- the provider sends no max_tokens.
#
# service_tier is deliberately absent: it is OpenAI-only and compatible
# endpoints reject unknown params.

run_tag: gates_kimi_resume
seed: 42

# Resume screen only -- 72 items in the bank, 20 selected at the boundary.
gates:
  - resume

calibration:
  repeats: 8
  band: [0.15, 0.85]
  n_select: 20

vision:
  repeats: 6

# Visual variants: fonts (controls + accessibility), color, highlighting,
# and layout density. T3_sans is the within-image reference.
variants:
  - id: T1_serif
    font_file: LiberationSerif-Regular.ttf

  - id: T3_sans
    font_file: LiberationSans-Regular.ttf

  - id: T7_comic
    font_file: ComicNeue-Regular.ttf

  - id: A1_opendyslexic
    font_file: OpenDyslexic-Regular.otf

  - id: A2_large_sans
    font_file: LiberationSans-Regular.ttf
    size_scale: 1.5

  - id: C1_red
    font_file: LiberationSans-Regular.ttf
    text_color: "#B00000"

  - id: C2_gray
    font_file: LiberationSans-Regular.ttf
    text_color: "#8C8C8C"

  - id: H1_highlight
    font_file: LiberationSans-Regular.ttf
    highlight_color: "#FFF2A8"

  - id: L1_cramped
    font_file: LiberationSans-Regular.ttf
    size_scale: 0.75
    line_spacing: 1.0

render:
  image_width: 1400
  base_size: 40
  padding_x: 90
  padding_y: 70
  max_text_width: 1220
  font_normalization: ag_height
  # Pinned to the gates_v1 font set so point sizes match the already-rendered
  # images in data/rendered/gates/. Keep this even if variants are trimmed --
  # normalization otherwise re-derives from a smaller font set and new renders
  # silently mismatch the cached ones.
  normalize_fonts:
    - LiberationSerif-Regular.ttf
    - LiberationSans-Regular.ttf
    - ComicNeue-Regular.ttf
    - OpenDyslexic-Regular.otf

providers:
  openai_compatible:
    api_key_env: OPENAI_COMPAT_API_KEY
    model_text: moonshotai/Kimi-K3
    model_vision: moonshotai/Kimi-K3

inference:
  temperature: null  # reasoning-era models reject explicit temperature
  max_retries: 6
  rate_limit_sleep: 1.5
  workers: 8
  seed: 42
