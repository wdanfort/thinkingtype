[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "typo-eval"
version = "0.1.0"
description = "Typography evaluation harness for AI vision models"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Typography Team"}]
license = {text = "MIT"}
dependencies = [
    "pillow>=10.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pytesseract>=0.3.10",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    # providers/google.py uses the new SDK (`from google import genai`,
    # genai.Client, types.HttpOptions); the legacy google-generativeai package
    # does not provide it, and providers/__init__.py imports eagerly, so the
    # wrong one breaks every provider, not just Google.
    "google-genai>=1.0.0",
    "scipy>=1.10.0",
    # gates/analyze.py writes summary.md via DataFrame.to_markdown, which needs
    # tabulate at runtime; without it the analysis writes every CSV and then
    # dies on the last line.
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
typo-eval = "typo_eval.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
